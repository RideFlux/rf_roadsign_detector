defaults:
  - _self_
  - datasets: pcd

datamodule:
  _target_: pcd.datamodule.RoadSignDataModule
  _recursive_: False

  data_processor:
    _target_: pcd.data_processor.DataProcessor
    root_dir: ${data.datasets.dataset_root_dir}
    pickle_files:
      train: train_set.pkl
      val: val_set.pkl
      test1: test1_set.pkl
      test2: test2_set.pkl
      test3: test3_set.pkl
    stride: 1
  
  dataset_class:
    _target_: pcd.dataset.RoadSignDataset

  batch_size: 16

  num_workers: 16