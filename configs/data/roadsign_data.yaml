defaults:
  - _self_
  - datasets: pcd

datamodule:
  _target_: pcd.datamodule.RoadSignDataModule
  _recursive_: False

  data_processor:
    _target_: pcd.data_processor.DataProcessor
    pickle_files:
      train: /home/rideflux/LIDAR_DATA/train_set.pkl
      val: /home/rideflux/LIDAR_DATA/val_set.pkl
      test1: /home/rideflux/LIDAR_DATA/test1_set.pkl
      test2: /home/rideflux/LIDAR_DATA/test2_set.pkl
      test3: /home/rideflux/LIDAR_DATA/test3_set.pkl
    stride: 1
  
  dataset_class:
    _target_: pcd.dataset.RoadSignDataset

  batch_size: 16

  num_workers: 16