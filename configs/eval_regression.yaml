task_name: eval

eval_checkpoint: checkpoints/best_regression_ver219.ckpt
testset_name: test1
inference_img_path: test_infer.png
detection_threshold: 0.5

eval_mode: 0
# 0: Choose options
# 1: Front view, 2: BEV, 3: Front + BEV, 4: 3D, 5: Quantitative

defaults:
  - _self_
  - data: roadsign_data_regression
  - model: pointpillars
  - callbacks: default
  - logger: mlflow
  - trainer: ddp
  - paths: default
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:  
  output_subdir: null  
  run:  
    dir: .
